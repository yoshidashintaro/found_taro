<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>当院を知ったきっかけ集計｜たろうメディカルクリニック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f6f7f6;--surface:#ffffff;--fg:#1d2422;--muted:#5f6b67;--line:#dde2df;--accent:#1f6f5c;--chip:#e8eeeb;
--sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141917;--surface:#1c2220;--fg:#e6ebe9;--muted:#9aa8a3;--line:#2f3836;--accent:#5cc2a6;--chip:#25302d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141917;--surface:#1c2220;--fg:#e6ebe9;--muted:#9aa8a3;--line:#2f3836;--accent:#5cc2a6;--chip:#25302d;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}
h1{font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:flex;flex-wrap:wrap;gap:28px}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.pie{position:relative;max-width:440px;width:100%;aspect-ratio:1;margin:0 auto}
.trend{position:relative;height:340px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:12px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
tfoot td{font-weight:700;border-bottom:none}
h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.mini h3{font-size:13px;margin:0 0 2px}.mini p{margin:0 0 8px;font-size:11px;color:var(--muted)}
.mini .c{position:relative;aspect-ratio:1}
.mini .top{font-size:11px;color:var(--muted);margin-top:6px}
.note{font-size:12px;color:var(--muted);max-width:75ch}
.note li{margin-bottom:4px}
.lead{max-width:75ch;margin:0 0 14px;font-size:13px}
</style>
</head>

<div class="wrap">
<header>
<h1>当院を知ったきっかけ集計</h1>
<p class="sub">たろうメディカルクリニック／<span id="period"></span></p>
</header>
<div>
<div class="label">集計単位</div><div class="chips" id="uchips"></div>
</div>
<div>
<div class="label">年齢層（回答日時点）</div><div class="chips" id="achips"></div>
</div>
<div class="kpis" id="kpis"></div>
<section class="main">
<div><div class="pie"><canvas id="pie" aria-label="きっかけ別円グラフ"></canvas></div></div>
<div class="tbl"><table id="tbl"></table></div>
</section>
<section>
<h2 id="minih"></h2>
<div class="grid" id="minis"></div>
</section>
<section>
<h2>年齢層 × きっかけ（回答数・構成比）</h2>
<div class="tbl"><table id="matrix"></table></div>
</section>
<section>
<h2 id="trendh"></h2>
<p class="lead">月ごとの回答数をきっかけ別に積み上げています（年齢層の絞り込みは反映しません）。</p>
<div class="panel"><div class="trend"><canvas id="trend" aria-label="月別推移"></canvas></div></div>
<div class="tbl" style="margin-top:16px"><table id="mtbl"></table></div>
</section>
<section>
<h2>問診票別の件数・回答率</h2>
<div class="tbl"><table id="rates"></table></div>
</section>
<section class="note">
<h2>集計方法</h2>
<ul id="notes"></ul>
</section>
</div>
